<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Gradiant Border</title>
    <style>
        body {
            display: grid;
            place-content: center;
            height: 90vh;
            background-color: #010218;
        }
        .card {
            width: 200px;
            height: 180px;
            cursor: pointer;
            background: linear-gradient(180deg, orange, rgb(249, 70, 100), rgb(244, 43, 244));
            transition: all 0.3s;
        }
        .child-card {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            transition: all 0.3s;
        }
        .card:hover {
            border-radius: 20px;
            box-shadow: 0px 0px 100px #18dde9;
        }
        .card:hover .child-card {
            scale: 0.95;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="child-card"></div>
    </div>
</body>
</html>
